[build]
  publish = "."

[dev]
  publish = "."

# Netlify Identity + Git Gateway for CMS
[identity]
  enabled = true

# متغيرات البيئة — أضف قيمها الحقيقية في لوحة Netlify (Site settings > Environment variables)
# GOOGLE_SHEETS_API_KEY = "AIza..."
# GOOGLE_SHEETS_ID      = "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
