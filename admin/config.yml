backend:
  name: git-gateway
  branch: main

locale: ar

media_folder: icons
public_folder: /icons

collections:

  - name: site_config
    label: "⚙️ إعدادات الموقع"
    files:
      - name: config
        label: "الإعدادات العامة"
        file: data/site-config.json
        format: json
        fields:
          - { label: "تاريخ الامتحان الجهوي", name: examDate, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss", hint: "تاريخ ووقت الامتحان الجهوي" }
          - { label: "السنة الدراسية", name: schoolYear, widget: string }
          - { label: "اسم الأستاذ", name: teacherName, widget: string }
          - { label: "اسم المؤسسة", name: institutionName, widget: string }
          - { label: "ملاحظات الامتحان", name: examNotes, widget: text }

  - name: infographics_collection
    label: "🎨 الإنفوغرافيا"
    files:
      - name: infographics
        label: "بطاقات الإنفوغرافيا"
        file: data/infographics.json
        format: json
        fields:
          - label: "البطاقات"
            name: cards
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "الترتيب", name: order, widget: number, value_type: int, hint: "رقم ترتيب البطاقة (1 = أول)" }
              - label: "المجال"
                name: domain
                widget: select
                options:
                  - { label: "📜 التاريخ", value: "history" }
                  - { label: "🗺️ الجغرافيا", value: "geography" }
                  - { label: "⚖️ المواطنة", value: "citizenship" }
              - { label: "الرمز (إيموجي)", name: emoji, widget: string, hint: "مثال: 🏛️ أو 🕊️" }
              - { label: "عنوان البطاقة", name: title, widget: string }
              - { label: "النقطة الأولى", name: point1, widget: string, hint: "مثال: 🔴 **1933:** هتلر يصل للسلطة" }
              - { label: "النقطة الثانية", name: point2, widget: string }
              - { label: "النقطة الثالثة", name: point3, widget: string }
              - { label: "النقطة الرابعة", name: point4, widget: string }
              - { label: "رابط الدرس", name: lessonUrl, widget: string, hint: "مثال: lessons/history/nazisme.html" }

  - name: summaries_collection
    label: "📄 ملخصات الأستاذ"
    files:
      - name: summaries
        label: "روابط ملخصات الأستاذ (Drive)"
        file: data/summaries.json
        format: json
        fields:
          - label: "الملخصات"
            name: summaries
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "معرف الدرس", name: id, widget: string, hint: "لا تعدّل هذا الحقل (nazisme, ww2, ...)", pattern: ['^[a-z-]+$', "حروف لاتينية وشرطات فقط"] }
              - { label: "اسم الملخص", name: title, widget: string }
              - { label: "رابط Google Drive", name: driveUrl, widget: string, hint: "الصق رابط المشاركة من Google Drive هنا (أو اتركه فارغاً)" }

  - name: quizzes
    label: "❓ أسئلة الاختبارات"
    files:
      - name: nazisme
        label: "النازية"
        file: data/quizzes.json
        format: json
        fields:
          - label: "أسئلة درس النازية"
            name: nazisme
            widget: list
            fields:
              - { label: "السؤال", name: question, widget: string }
              - label: "الخيارات (4 خيارات)"
                name: options
                widget: list
                field: { label: "خيار", name: option, widget: string }
              - { label: "رقم الإجابة الصحيحة (0-3)", name: answer, widget: number, value_type: int, min: 0, max: 3 }
              - { label: "التفسير", name: explanation, widget: string }

      - name: ww2
        label: "الحرب العالمية الثانية"
        file: data/quizzes.json
        format: json
        fields:
          - label: "أسئلة درس الحرب العالمية الثانية"
            name: ww2
            widget: list
            fields:
              - { label: "السؤال", name: question, widget: string }
              - label: "الخيارات"
                name: options
                widget: list
                field: { label: "خيار", name: option, widget: string }
              - { label: "رقم الإجابة الصحيحة (0-3)", name: answer, widget: number, value_type: int, min: 0, max: 3 }
              - { label: "التفسير", name: explanation, widget: string }

      - name: palestine
