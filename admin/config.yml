backend:
  name: git-gateway
  branch: main

locale: ar

media_folder: icons
public_folder: /icons

collections:

  - name: site_config
    label: "⚙️ إعدادات الموقع"
    files:
      - name: config
        label: "الإعدادات العامة"
        file: data/site-config.json
        format: json
        fields:
          - { label: "تاريخ الامتحان الجهوي", name: examDate, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss", hint: "تاريخ ووقت الامتحان الجهوي" }
          - { label: "السنة الدراسية", name: schoolYear, widget: string }
          - { label: "اسم الأستاذ", name: teacherName, widget: string }
          - { label: "اسم المؤسسة", name: institutionName, widget: string }
          - { label: "ملاحظات الامتحان", name: examNotes, widget: text }

  - name: quizzes
    label: "❓ أسئلة الاختبارات"
    files:
      - name: nazisme
        label: "النازية"
        file: data/quizzes.json
        format: json
        fields:
          - label: "أسئلة درس النازية"
            name: nazisme
            widget: list
            fields:
              - { label: "السؤال", name: question, widget: string }
              - label: "الخيارات (4 خيارات)"
                name: options
                widget: list
                field: { label: "خيار", name: option, widget: string }
              - { label: "رقم الإجابة الصحيحة (0-3)", name: answer, widget: number, value_type: int, min: 0, max: 3 }
              - { label: "التفسير", name: explanation, widget: string }

      - name: ww2
        label: "الحرب العالمية الثانية"
        file: data/quizzes.json
        format: json
        fields:
